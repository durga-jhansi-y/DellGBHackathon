[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-geo-dev"
version = "0.1.0"
description = "Unsigned TX003 offline imagery development fixture"
requires-python = ">=3.11"
dependencies = ["Pillow==10.2.0"]

[project.optional-dependencies]
test = ["jsonschema==4.23.0"]

[tool.setuptools]
packages = ["crystal_geo"]

[tool.setuptools.package-data]
crystal_geo = ["tx003.json", "index.sql"]
