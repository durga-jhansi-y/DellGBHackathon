[package]
name = "crystal_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only verification and retrieval for unsigned Crystal Geo development packages"
publish = false

[dependencies]
base64 = "=0.22.1"
image = { version = "=0.25.8", default-features = false, features = ["webp"] }
rusqlite = { version = "=0.37.0", features = ["bundled", "serialize", "limits", "hooks"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"

[dev-dependencies]
tempfile = "=3.23.0"

[[bin]]
name = "crystal-core"
path = "src/main.rs"
